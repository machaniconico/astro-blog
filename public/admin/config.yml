backend:
  name: github
  repo: machaniconico/astro-blog
  branch: main
  auth_methods: [token]

site_url: https://machaniconico.com
app_title: まちゃブログ投稿
locale: ja

media_folder: /public/images/blog
public_folder: /images/blog
media_libraries:
  all:
    max_file_size: 12582912
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      svg:
        optimize: true

collections:
  - name: diary
    label: 日常の日記
    label_singular: 日記
    icon: edit_note
    folder: src/content/diary
    media_folder: /public/images/diary
    public_folder: /images/diary
    create: true
    delete: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{pubDate}}"
    fields:
      - label: タイトル
        name: title
        widget: string
        maxlength: 80
        hint: 記事の見出しになります
      - label: 本文
        name: body
        widget: richtext
        modes: [rich_text]
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
          - link
        editor_components: [image, photo, styled-text, callout, divider, details]
        allow_nested_components: false
        linked_images: false
        sanitize_preview: true
        hint: 写真だけなら画像ボタン。説明・一言・表示幅も付けるなら「挿入 → 説明つき写真」を使います
      - name: description
        widget: hidden
        default: 日常の記録
      - name: pubDate
        widget: hidden
        default: "{{datetime}}"
      - name: tags
        widget: hidden
        default: []

  - name: blog
    label: ブログ記事（開発記録）
    label_singular: ブログ記事
    icon: article
    folder: src/content/blog
    extension: md
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: タイトル
        name: title
        widget: string
        maxlength: 80
        hint: 記事の見出しになります
      - label: 本文
        name: body
        widget: richtext
        modes: [rich_text]
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
          - link
        editor_components: [code-block, image, photo, styled-text, callout, divider, details]
        allow_nested_components: false
        linked_images: false
        sanitize_preview: true
        hint: 通常はそのまま入力。写真・文字スタイル・囲み・折りたたみは「挿入」、コード例は段落の種類から選べます
      - label: アイキャッチ画像（任意）
        name: heroImage
        widget: image
        required: false
      - name: description
        widget: hidden
        default: ""
      - name: pubDate
        widget: hidden
        default: "{{datetime}}"

  - name: works
    label: 成果物
    icon: deployed_code
    folder: src/content/works
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "タイトル", name: title, widget: string }
      - { label: "説明", name: description, widget: string }
      - label: "技術スタック"
        name: techStack
        widget: list
        field: { label: 技術, name: tech, widget: string }
      - { label: "公開日", name: pubDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Live URL", name: liveUrl, widget: string, required: false }
      - { label: "GitHub URL", name: githubUrl, widget: string, required: false }
      - { label: "本文", name: body, widget: markdown }
